# Lane D, Depth: vLLM TP=2 across both Sparks. One logical GPU, one shared KV pool.
#
# Two explicit services, no rank magic: sparkduetctl.sh brings up `depth-worker`
# on the worker node first, then `depth-head` on the head node. Both read the same
# sparkduet.env. Head serves the OpenAI API on D_HOST:D_PORT; the worker is headless.
#
# Weights: set DS_MODEL to a HF repo id (resolved via the mounted HF cache) or an
# absolute path under MODEL_DIR for fully offline serving from local disk.

x-depth-common: &depth-common
  image: ${VLLM_IMAGE}
  # entry.sh applies the idempotent container-start hotfixes (see patches/)
  # then execs `vllm serve` with the same args; explicit so images whose
  # default entrypoint differs cannot double or drop the launcher
  entrypoint: ["/sparkduet-patches/entry.sh"]
  network_mode: host
  # A lone rank cannot form the TP=2 group. Pair restarts only, via
  # sparkduetctl.sh or zorost-lane-guard.
  restart: "no"
  ipc: host
  shm_size: 32gb
  # /dev/infiniband is NOT optional for TP=2: without it NCCL cannot open the
  # RDMA verbs devices and silently falls back to TCP at ~40% of the RDMA rate
  # (measured 4.0 vs 9-10 GB/s bus bandwidth on a live pair).
  devices:
    - /dev/infiniband:/dev/infiniband
  cap_add:
    - IPC_LOCK
  volumes:
    - ${HF_CACHE}:/root/.cache/huggingface
    - ${MODEL_DIR}:${MODEL_DIR}:ro
    - ../patches:/sparkduet-patches:ro
    # persists FlashInfer autotune + torch.compile caches across container
    # recreates: saves 5-10 minutes of re-JIT on every config change
    - ${VLLM_CACHE_DIR:-/srv/ai/cache/vllm}:/root/.cache/vllm
  deploy:
    resources:
      reservations:
        devices:
          - capabilities: ["gpu"]

x-depth-env: &depth-env
  HF_HOME: /root/.cache/huggingface
  HF_HUB_OFFLINE: "${HF_HUB_OFFLINE}"
  NCCL_IB_HCA: ${NCCL_IB_HCA}
  NCCL_SOCKET_IFNAME: ${NCCL_SOCKET_IFNAME}
  # Gloo (torch's CPU rendezvous) must be pinned to ONE rail whose subnet
  # matches MASTER_ADDR. A comma list here lets the two ranks pick different
  # rails on different subnets and the rendezvous dies with
  # "Connection closed by peer" after the NCCL side already worked.
  GLOO_SOCKET_IFNAME: ${GLOO_SOCKET_IFNAME:-${NCCL_SOCKET_IFNAME}}
  NCCL_IB_GID_INDEX: "${NCCL_IB_GID_INDEX}"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "${VLLM_USE_BREAKABLE_CUDAGRAPH}"
  # UCX (the inter-node RDMA transport under NCCL) leaks ~14 MB of
  # registration-cache per request with the default unbounded setting; on
  # unified memory that slowly drains the UMA until the host wedges.
  # Community root cause and fix: NVIDIA forum thread 374742.
  UCX_MEM_MMAP_HOOK_MODE: none
  UCX_RCACHE_MAX_UNRELEASED: "1024"
  # Three JIT caches (Triton, TileLang, and the CuTeDSL object cache behind
  # the b12x MoE backend) default to paths inside the container layer, so a
  # recreate throws them away and the kernels re-JIT mid-serve. On TP=2 a
  # compile stall on one rank can outlive the NCCL watchdog and take the
  # whole pair down; keep the caches on the persisted vLLM cache volume.
  TRITON_CACHE_DIR: /root/.cache/vllm/jit/triton
  TILELANG_CACHE_DIR: /root/.cache/vllm/jit/tilelang
  B12X_CUTE_COMPILE_CACHE_DIR: /root/.cache/vllm/jit/b12x-cute
  # PyTorch flight recorder: ring buffer of recent collectives, dumped one
  # file per rank on watchdog timeout so a TP hang leaves forensics instead
  # of nothing. Analyze with `torchfrtrace <prefix>*`. This image (torch
  # 2.11) prefers TORCH_FR_BUFFER_SIZE and still accepts the older
  # TORCH_NCCL_TRACE_BUFFER_SIZE alias; both dump-path keys are set.
  TORCH_FR_BUFFER_SIZE: "2000"
  TORCH_NCCL_TRACE_BUFFER_SIZE: "2000"
  TORCH_NCCL_DUMP_ON_TIMEOUT: "1"
  TORCH_NCCL_DEBUG_INFO_TEMP_FILE: /root/.cache/vllm/nccl-flight/trace_rank_
  TORCH_FR_DUMP_TEMP_FILE: /root/.cache/vllm/nccl-flight/trace_rank_

services:
  depth-head:
    <<: *depth-common
    container_name: sparkduet-depth-head
    environment:
      <<: *depth-env
      VLLM_HOST_IP: ${MASTER_ADDR}
    command: >
      ${DS_MODEL}
      --served-model-name ${DS_SERVED_NAME}
      --trust-remote-code
      --tensor-parallel-size 2
      --distributed-executor-backend mp
      --nnodes 2 --node-rank 0
      --master-addr ${MASTER_ADDR} --master-port ${MASTER_PORT}
      --kv-cache-dtype ${D_KV_DTYPE}
      --block-size 256
      --max-model-len ${D_MAX_MODEL_LEN}
      --max-num-seqs ${D_MAX_NUM_SEQS}
      --max-num-batched-tokens ${D_MAX_NUM_BATCHED_TOKENS}
      --long-prefill-token-threshold ${D_LONG_PREFILL_TOKEN_THRESHOLD}
      --enable-chunked-prefill
      --async-scheduling
      --enable-prefix-caching
      --gpu-memory-utilization ${D_GPU_MEM_UTIL}
      --max-cudagraph-capture-size 48
      --moe-backend flashinfer_b12x
      --enable-auto-tool-choice
      --tool-call-parser deepseek_v4
      --reasoning-parser deepseek_v4
      --generation-config vllm
      --speculative-config '{"method":"dspark","num_speculative_tokens":${D_MTP_NUM_TOKENS},"draft_sample_method":"probabilistic"}'
      --host ${D_HOST}
      --port ${D_PORT}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${D_PORT}/v1/models || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 1200s

  depth-worker:
    <<: *depth-common
    container_name: sparkduet-depth-worker
    environment:
      <<: *depth-env
      VLLM_HOST_IP: ${WORKER_FABRIC_IP}
    command: >
      ${DS_MODEL}
      --served-model-name ${DS_SERVED_NAME}
      --trust-remote-code
      --tensor-parallel-size 2
      --distributed-executor-backend mp
      --nnodes 2 --node-rank 1 --headless
      --master-addr ${MASTER_ADDR} --master-port ${MASTER_PORT}
      --kv-cache-dtype ${D_KV_DTYPE}
      --block-size 256
      --max-model-len ${D_MAX_MODEL_LEN}
      --max-num-seqs ${D_MAX_NUM_SEQS}
      --max-num-batched-tokens ${D_MAX_NUM_BATCHED_TOKENS}
      --long-prefill-token-threshold ${D_LONG_PREFILL_TOKEN_THRESHOLD}
      --enable-chunked-prefill
      --async-scheduling
      --enable-prefix-caching
      --gpu-memory-utilization ${D_GPU_MEM_UTIL}
      --max-cudagraph-capture-size 48
      --moe-backend flashinfer_b12x
      --generation-config vllm
      --speculative-config '{"method":"dspark","num_speculative_tokens":${D_MTP_NUM_TOKENS},"draft_sample_method":"probabilistic"}'
