# Lane G via the published SM121 SGLang runtime (not the vLLM FA2 path).
# Official vLLM glm53-flash-arm64-cu130 has no MLA prefill for this NoPE
# checkpoint and collapses to token 1023 ("lock"). This image serves DSA
# flashinfer_sparse_mla for prefill and decode. Same :30000 contract as
# the other lanes. Never concurrent with depth, next, or fleet.
#
# Image digest and launch flags match the accepted TP=2 Spark recipe.
# NCCL address range is this kit's fabric (10.100.0.0/16), not 10.10.0.0/16.

services:
  glm-sglang:
    image: ${G_SGLANG_IMAGE}
    container_name: sparkduet-glm-sglang-rank${G_SGLANG_RANK}
    # A lone rank cannot form the multi-node group. Pair restarts only, via
    # sparkduetctl.sh or zorost-lane-guard.
    restart: "no"
    gpus: all
    network_mode: host
    ipc: host
    shm_size: 64gb
    ulimits:
      memlock: -1
      stack: 67108864
    cap_add:
      - IPC_LOCK
    devices:
      - /dev/infiniband:/dev/infiniband
    entrypoint: ["/opt/glm53/launch-spark.sh"]
    volumes:
      - ${G_MODEL}:/model:ro
      - ${VLLM_CACHE_DIR:-/srv/ai/cache/vllm}:/root/.cache:rw
    environment:
      NNODES: "2"
      NODE_RANK: ${G_SGLANG_RANK}
      DIST_INIT_ADDR: ${MASTER_ADDR}:27000
      TP_SIZE: "2"
      EP_SIZE: "2"
      CONTEXT_LENGTH: ${G_SGLANG_CONTEXT:-131072}
      MAX_RUNNING_REQUESTS: ${G_SGLANG_MAX_REQS:-2}
      MEM_FRACTION_STATIC: ${G_SGLANG_MEM_FRACTION:-0.85}
      CUDA_GRAPH_MAX_BS: ${G_SGLANG_GRAPH_BS:-2}
      CHUNKED_PREFILL_SIZE: ${G_SGLANG_CHUNK:-4096}
      PORT: ${G_PORT}
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      TORCH_CUDA_ARCH_LIST: 12.1a
      FLASHINFER_CUDA_ARCH_LIST: 12.1a
      CUTE_DSL_ARCH: sm_121a
      SGLANG_OPT_USE_TOPK_V2: "0"
      SGLANG_OPT_USE_TILELANG_INDEXER: "1"
      SGLANG_FP8_PAGED_MQA_LOGITS_TORCH: "1"
      SGLANG_OPT_DEEPGEMM_HC_PRENORM: "0"
      SGLANG_OPT_FP8_WO_A_GEMM: "0"
      NCCL_NET: IB
      NCCL_IB_DISABLE: "0"
      NCCL_IB_HCA: ${NCCL_IB_HCA}
      NCCL_IB_GID_INDEX: "${NCCL_IB_GID_INDEX}"
      NCCL_IB_ROCE_VERSION_NUM: "2"
      NCCL_IB_ADDR_FAMILY: AF_INET
      NCCL_IB_ADDR_RANGE: ${NCCL_IB_ADDR_RANGE:-10.100.0.0/16}
      NCCL_SOCKET_IFNAME: ${NCCL_SOCKET_IFNAME}
      GLOO_SOCKET_IFNAME: ${GLOO_SOCKET_IFNAME:-${NCCL_SOCKET_IFNAME}}
      TP_SOCKET_IFNAME: ${NCCL_SOCKET_IFNAME}
      NCCL_CROSS_NIC: "1"
      NCCL_CUMEM_ENABLE: "0"
      NCCL_NVLS_ENABLE: "0"
      NCCL_MAX_NCHANNELS: "4"
      NCCL_MIN_NCHANNELS: "4"
      NCCL_IGNORE_CPU_AFFINITY: "1"
      NCCL_DEBUG: WARN
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONUNBUFFERED: "1"
