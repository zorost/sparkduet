<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="four-on-two-title four-on-two-desc">
        <title id="four-on-two-title">Four residents, two Sparks</title>
        <desc id="four-on-two-desc">Architecture of SparkDuet: coding tools hit one endpoint, which pins a single resident lane across two DGX Sparks while the on-demand library stays on disk.</desc>
        <defs>
          <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#5A6672"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#FF3621"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#0A7F7A"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#EEF1F4"/>

        <!-- Zones -->
        <rect x="40" y="80" width="240" height="480" rx="8" fill="rgba(17,22,29,0.02)" stroke="rgba(17,22,29,0.10)" stroke-width="0.8"/>
        <rect x="112" y="84" width="96" height="12" rx="2" fill="#EEF1F4"/>
        <text x="160" y="93" fill="rgba(17,22,29,0.40)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">CLIENTS</text>

        <rect x="320" y="80" width="280" height="480" rx="8" fill="rgba(17,22,29,0.02)" stroke="rgba(17,22,29,0.10)" stroke-width="0.8"/>
        <rect x="412" y="84" width="96" height="12" rx="2" fill="#EEF1F4"/>
        <text x="460" y="93" fill="rgba(17,22,29,0.40)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">ENDPOINT</text>

        <rect x="640" y="80" width="600" height="480" rx="8" fill="rgba(17,22,29,0.02)" stroke="rgba(17,22,29,0.10)" stroke-width="0.8"/>
        <rect x="868" y="84" width="144" height="12" rx="2" fill="#EEF1F4"/>
        <text x="940" y="93" fill="rgba(17,22,29,0.40)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">TWO DGX SPARKS</text>

        <!-- Arrows (before boxes) -->
        <line x1="260" y1="280" x2="360" y2="280" stroke="#0A7F7A" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <path d="M 560,264 H 672 Q 680,264 680,256 V 200" fill="none" stroke="#FF3621" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <path d="M 560,296 H 672 Q 680,296 680,304 V 360" fill="none" stroke="#5A6672" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <line x1="880" y1="180" x2="1000" y2="180" stroke="#5A6672" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 880,216 H 968 Q 976,216 976,224 V 352 Q 976,360 984,360 H 1000" fill="none" stroke="#5A6672" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="276" y="256" width="68" height="12" rx="2" fill="#EEF1F4"/>
        <text x="310" y="266" fill="#0A7F7A" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">OPENAI</text>

        <rect x="568" y="240" width="60" height="12" rx="2" fill="#EEF1F4"/>
        <text x="598" y="250" fill="#FF3621" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">RESIDENT</text>

        <rect x="568" y="316" width="72" height="12" rx="2" fill="#EEF1F4"/>
        <text x="604" y="326" fill="#5A6672" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ON DEMAND</text>

        <rect x="888" y="160" width="44" height="12" rx="2" fill="#EEF1F4"/>
        <text x="910" y="170" fill="#5A6672" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">TP=2</text>

        <!-- Clients -->
        <rect x="60" y="240" width="200" height="80" rx="6" fill="#EEF1F4"/>
        <rect x="60" y="240" width="200" height="80" rx="6" fill="rgba(90,102,114,0.10)" stroke="#8A939C" stroke-width="1"/>
        <rect x="68" y="246" width="40" height="12" rx="2" fill="transparent" stroke="rgba(138,147,156,0.40)" stroke-width="0.8"/>
        <text x="88" y="255" fill="rgba(138,147,156,0.90)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
        <text x="160" y="280" fill="#11161D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Your tools</text>
        <text x="160" y="300" fill="#5A6672" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">OpenCode · Chat · Hermes</text>

        <!-- Endpoint (focal) -->
        <rect x="360" y="240" width="200" height="80" rx="6" fill="#EEF1F4"/>
        <rect x="360" y="240" width="200" height="80" rx="6" fill="rgba(255,54,33,0.08)" stroke="#FF3621" stroke-width="1.2"/>
        <rect x="368" y="246" width="40" height="12" rx="2" fill="transparent" stroke="rgba(255,54,33,0.40)" stroke-width="0.8"/>
        <text x="388" y="255" fill="#FF3621" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
        <text x="460" y="280" fill="#11161D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">One endpoint</text>
        <text x="460" y="300" fill="#5A6672" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">sparkduetctl · :30000</text>

        <!-- Resident -->
        <rect x="680" y="160" width="200" height="80" rx="6" fill="#EEF1F4"/>
        <rect x="680" y="160" width="200" height="80" rx="6" fill="#FFFFFF" stroke="#11161D" stroke-width="1"/>
        <rect x="688" y="166" width="40" height="12" rx="2" fill="transparent" stroke="rgba(17,22,29,0.40)" stroke-width="0.8"/>
        <text x="708" y="175" fill="rgba(17,22,29,0.80)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">GPU</text>
        <text x="780" y="200" fill="#11161D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">One resident</text>
        <text x="780" y="220" fill="#5A6672" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">D · F · N · G</text>

        <!-- Library -->
        <rect x="680" y="360" width="200" height="80" rx="6" fill="#EEF1F4"/>
        <rect x="680" y="360" width="200" height="80" rx="6" fill="rgba(17,22,29,0.05)" stroke="#5A6672" stroke-width="1"/>
        <rect x="688" y="366" width="48" height="12" rx="2" fill="transparent" stroke="rgba(90,102,114,0.40)" stroke-width="0.8"/>
        <text x="712" y="375" fill="rgba(90,102,114,0.90)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DISK</text>
        <text x="780" y="400" fill="#11161D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">On-demand library</text>
        <text x="780" y="420" fill="#5A6672" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">llama-swap · TTL unload</text>

        <!-- Spark 1 -->
        <rect x="1000" y="140" width="200" height="80" rx="6" fill="#EEF1F4"/>
        <rect x="1000" y="140" width="200" height="80" rx="6" fill="#FFFFFF" stroke="#11161D" stroke-width="1"/>
        <rect x="1008" y="146" width="48" height="12" rx="2" fill="transparent" stroke="rgba(17,22,29,0.40)" stroke-width="0.8"/>
        <text x="1032" y="155" fill="rgba(17,22,29,0.80)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BOX</text>
        <text x="1100" y="180" fill="#11161D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Spark 1</text>
        <text x="1100" y="200" fill="#5A6672" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">121 GiB · head</text>

        <!-- Spark 2 -->
        <rect x="1000" y="320" width="200" height="80" rx="6" fill="#EEF1F4"/>
        <rect x="1000" y="320" width="200" height="80" rx="6" fill="#FFFFFF" stroke="#11161D" stroke-width="1"/>
        <rect x="1008" y="326" width="48" height="12" rx="2" fill="transparent" stroke="rgba(17,22,29,0.40)" stroke-width="0.8"/>
        <text x="1032" y="335" fill="rgba(17,22,29,0.80)" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BOX</text>
        <text x="1100" y="360" fill="#11161D" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Spark 2</text>
        <text x="1100" y="380" fill="#5A6672" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">121 GiB · worker</text>

        <!-- Legend -->
        <line x1="40" y1="652" x2="1240" y2="652" stroke="rgba(17,22,29,0.10)" stroke-width="0.8"/>
        <text x="40" y="676" fill="#5A6672" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>
        <rect x="140" y="664" width="16" height="12" rx="2" fill="rgba(255,54,33,0.08)" stroke="#FF3621" stroke-width="1"/>
        <text x="164" y="674" fill="#5A6672" font-size="8" font-family="'Geist', sans-serif">One live resident</text>
        <rect x="360" y="664" width="16" height="12" rx="2" fill="rgba(17,22,29,0.05)" stroke="#5A6672" stroke-width="1"/>
        <text x="384" y="674" fill="#5A6672" font-size="8" font-family="'Geist', sans-serif">Weights on disk</text>
        <line x1="560" y1="670" x2="588" y2="670" stroke="#0A7F7A" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="596" y="674" fill="#5A6672" font-size="8" font-family="'Geist', sans-serif">OpenAI call</text>
        <line x1="760" y1="670" x2="788" y2="670" stroke="#5A6672" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="796" y="674" fill="#5A6672" font-size="8" font-family="'Geist', sans-serif">Load on demand</text>
      </svg>
