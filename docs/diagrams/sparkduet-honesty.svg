<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 560" role="img" aria-label="The measurement pipeline: warm up, run suites, count tokens from usage frames, capture acceptance deltas, label every number on the claims ladder">
  <defs>
    <marker id="harr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8FA1B3"/>
    </marker>
  </defs>
  <rect width="1240" height="560" fill="#101418"/>
  <text x="48" y="56" font-family="Menlo, Consolas, monospace" font-size="24" font-weight="bold" fill="#F2EFE8" letter-spacing="2">MEASURE WITHOUT LYING</text>
  <text x="48" y="84" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#C7D0D9">every published number carries its method; the harness refuses the known ways of fooling yourself</text>
  <line x1="48" y1="102" x2="1192" y2="102" stroke="#2A333D"/>

  <!-- pipeline -->
  <rect x="48" y="140" width="200" height="96" rx="8" fill="#161C22" stroke="#2F3A46"/>
  <text x="148" y="176" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14.5" font-weight="bold" fill="#F2EFE8">warmup.sh</text>
  <text x="148" y="200" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#C7D0D9">JIT + graph keys hot,</text>
  <text x="148" y="218" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#C7D0D9">first run discarded</text>
  <line x1="248" y1="188" x2="292" y2="188" stroke="#8FA1B3" stroke-width="1.5" marker-end="url(#harr)"/>

  <rect x="296" y="140" width="240" height="96" rx="8" fill="#161C22" stroke="#2F3A46"/>
  <text x="416" y="170" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14.5" font-weight="bold" fill="#F2EFE8">bench.py --suite &#8230;</text>
  <text x="416" y="194" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="11" fill="#C7D0D9">standard &#183; fleet &#183; mixed &#183; spec</text>
  <text x="416" y="216" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#C7D0D9">prompt &#215; concurrency &#215; thinking</text>
  <line x1="536" y1="188" x2="580" y2="188" stroke="#8FA1B3" stroke-width="1.5" marker-end="url(#harr)"/>

  <rect x="584" y="140" width="300" height="96" rx="8" fill="#1B2230" stroke="#E8B75B" stroke-width="1.5"/>
  <text x="734" y="170" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14.5" font-weight="bold" fill="#F0C97A">tokens = usage frames</text>
  <text x="734" y="194" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#DDE4EA">never SSE-chunk counting: one chunk can carry</text>
  <text x="734" y="212" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#DDE4EA">23 tokens under speculation (2.5&#215; undercounts)</text>
  <line x1="884" y1="188" x2="928" y2="188" stroke="#8FA1B3" stroke-width="1.5" marker-end="url(#harr)"/>

  <rect x="932" y="140" width="260" height="96" rx="8" fill="#161C22" stroke="#2F3A46"/>
  <text x="1062" y="170" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14.5" font-weight="bold" fill="#F2EFE8">results/*.json + .md</text>
  <text x="1062" y="194" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#C7D0D9">TTFT p50/p95 &#183; acceptance deltas</text>
  <text x="1062" y="212" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#C7D0D9">clocks captured &#183; dated artifacts</text>

  <!-- refusals -->
  <rect x="48" y="272" width="560" height="120" rx="8" fill="#161C22" stroke="#5A2430"/>
  <text x="72" y="304" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="bold" fill="#FF8FA3">THE HARNESS REFUSES</text>
  <text x="72" y="330" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#DDE4EA">&#183; runs shorter than 30 s (no steady state)</text>
  <text x="72" y="352" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#DDE4EA">&#183; responses without usage.completion_tokens</text>
  <text x="72" y="374" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#DDE4EA">&#183; missing speculation counters under --require-acceptance</text>

  <rect x="632" y="272" width="560" height="120" rx="8" fill="#161C22" stroke="#2F3A46"/>
  <text x="656" y="304" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="bold" fill="#F2EFE8">RULES THE TABLES OBEY</text>
  <text x="656" y="330" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#DDE4EA">&#183; a ceiling never shares a cell with a speed</text>
  <text x="656" y="352" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#DDE4EA">&#183; speculation status is part of every claim</text>
  <text x="656" y="374" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#DDE4EA">&#183; a changed number ships with its artifact, or it does not ship</text>

  <!-- ladder -->
  <rect x="48" y="428" width="1144" height="96" rx="8" fill="#141A20" stroke="#2A333D"/>
  <text x="72" y="460" font-family="Menlo, Consolas, monospace" font-size="14" font-weight="bold" fill="#F2EFE8">THE CLAIMS LADDER</text>
  <rect x="72" y="476" width="118" height="30" rx="15" fill="#8A6420"/>
  <text x="131" y="496" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13.5" font-weight="bold" fill="#FFE7B8">[M-here]</text>
  <text x="204" y="496" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#DDE4EA">measured on this pair, artifact committed</text>
  <rect x="520" y="476" width="118" height="30" rx="15" fill="#31527E"/>
  <text x="579" y="496" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13.5" font-weight="bold" fill="#CFE3FF">[M-else]</text>
  <text x="652" y="496" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#DDE4EA">third-party, cited</text>
  <rect x="836" y="476" width="70" height="30" rx="15" fill="#2E4A3A"/>
  <text x="871" y="496" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="13.5" font-weight="bold" fill="#A9E0BE">[P]</text>
  <text x="920" y="496" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#DDE4EA">projection, derivation shown</text>
</svg>
